name: CI

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABASIC_TEST_DB_MYSQL_URL: mysql+asyncmy://databasic:databasic@mariadb/databasic_test
      DATABASIC_TEST_DB_POSTGRESQL_URL: postgresql+psycopg://postgres:postgres@postgres/postgres

    container:
      image: python:3.15

    services:
      mariadb:
        image: mariadb:13.0.2-ubi
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: databasic_test
          MARIADB_USER: databasic
          MARIADB_PASSWORD: databasic
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - run: make static
      - run: make test

  test-master:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABASIC_TEST_DB_MYSQL_URL: mysql+asyncmy://databasic:databasic@mariadb/databasic_test
      DATABASIC_TEST_DB_POSTGRESQL_URL: postgresql+psycopg://postgres:postgres@postgres/postgres

    container:
      image: python:3.15

    services:
      mariadb:
        image: mariadb:13.0.2-ubi
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: databasic_test
          MARIADB_USER: databasic
          MARIADB_PASSWORD: databasic
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - run: make tox

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: test-master

    container:
      image: python:3.15

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - run: make build
      - run: make publish
