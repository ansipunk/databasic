[project]
name = "databasic"
version = "0.2.1"
description = "Asynchronous database connection manager and query executor"
readme = "README.md"
license = "MIT"
authors = [
    { name = "ansipunk", email = "ansipunk@proton.me" }
]
requires-python = ">=3.11,<3.16"
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "psycopg[binary,pool]>=3,<4",
    "sqlalchemy>=2,<2.2",
]

[project.urls]
Homepage = "https://github.com/ansipunk/databasic"
Documentation = "https://github.com/ansipunk/databasic#readme"
Repository = "https://github.com/ansipunk/databasic"
Issues = "https://github.com/ansipunk/databasic/issues"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7,<8",
    "pytest-xdist>3,<4",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.pytest]
addopts = [
    "--cov", "databasic",
    "--cov-report", "term-missing",
    "--cov-report", "html",
    "--cov-fail-under", "100",
    "-n 4",
]
testpaths = [
    "tests",
]
