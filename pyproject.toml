[project]
name = "databasic"
version = "0.1.0"
description = "Database connection helper"
readme = "README.md"
license = "MIT"
authors = [
    { name = "ansipunk", email = "ansipunk@proton.me" }
]
requires-python = ">=3.11,<3.16"
dependencies = [
    "psycopg[binary,pool]>=3,<4",
    "sqlalchemy>=2,<2.2",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7,<8",
    "pytest-xdist>3,<4",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.pytest]
addopts = [
    "--cov", "databasic",
    "--cov-report", "term-missing",
    "--cov-report", "html",
    "--cov-fail-under", "100",
    "-n 4",
]
testpaths = [
    "tests",
]
